name: Auto Create PR for LeetCode

on:
  push:
    branches:
      - leethub-sync

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PR and Trigger CodeRabbit
        env:
          # כאן התבצע השינוי: החלפנו לטוקן אישי שלך
          GH_TOKEN: ${{ secrets.MY_PERSONAL_TOKEN }}
        run: |
          # Check if a PR is already open to avoid errors
          PR_EXISTS=$(gh pr list --head leethub-sync --base main --json number --jq 'length')
          
          if [ "$PR_EXISTS" -eq "0" ]; then
            # Create the PR and capture its URL
            PR_URL=$(gh pr create \
              --base main \
              --head leethub-sync \
              --title "🤖 New LeetCode Solution" \
              --body "This PR was generated automatically after a push from LeetHub. Ready for Code Review.")
            
            echo "PR created successfully: $PR_URL"
            
            # Wake up CodeRabbit automatically
            gh pr comment $PR_URL --body "@coderabbitai review"
          else
            echo "A PR is already open. The new commit was added to it."
            
            # Retrieve existing PR URL and request a re-review for the new commit
            PR_URL=$(gh pr list --head leethub-sync --base main --json url --jq '.[0].url')
            gh pr comment $PR_URL --body "@coderabbitai review"
          fi
